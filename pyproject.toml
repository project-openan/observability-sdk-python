[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openan-observability-sdk"
version = "1.0.0"
description = "OpenAN observability SDK for A2A-T, workflow, and agent signals"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenAN" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "opentelemetry-api>=1.45.1,<2.0.0",
  "opentelemetry-sdk>=1.45.1,<2.0.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.45.1,<2.0.0",
  "opentelemetry-exporter-otlp-proto-http>=1.45.1,<2.0.0",
  "PyYAML>=6.0,<7.0",
]

[project.urls]
Homepage = "https://github.com/project-openan/observability-sdk-python"
Repository = "https://github.com/project-openan/observability-sdk-python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openan_observability_sdk = ["config/*.yaml", "py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
